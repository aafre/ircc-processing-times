<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Standard — India</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#f3f4f6;color:#111827;font:400 15px/1.5 Inter,system-ui,sans-serif}
.bar{background:#fff;display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #e5e7eb;font-weight:800}
.bar span{color:#2563eb}
.search{margin:14px 16px 0;background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:10px 12px;color:#6b7280}
h1{padding:18px 16px 4px;font-size:24px;font-weight:800;line-height:1.2}
.sub{padding:0 16px;color:#6b7280;font-size:14px}
.card{margin:14px 16px 0;background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.big b{font-size:64px;font-weight:800;color:#2563eb;line-height:1}
.big span{font-size:18px;color:#374151;margin-left:6px}
.big p{color:#4b5563;font-size:14px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 16px 0}
.grid div{background:#fff;border-radius:12px;padding:10px;font-size:12px;color:#6b7280}
.grid b{display:block;font-size:22px;color:#111827}
.ad{margin:12px 16px 0;border:1px dashed #d1d5db;border-radius:12px;height:70px;display:grid;place-items:center;color:#4b5563;font-size:12px}
</style></head><body>
<header class="bar">Canada <span>Visa Tracker</span></header>
<div class="search">Search your country</div>
<h1>India visa processing times</h1>
<p class="sub">Updated 14 Oct 2026 · Source: IRCC</p>
<div class="card big"><b>29</b><span>days</span><p>Visitor visa. Apply today, decision around 20 Nov.</p></div>
<div class="grid"><div>Study<b>49d</b></div><div>Super visa<b>77d</b></div><div>Work<b>77d</b></div></div>
<div class="card"><b style="font-size:14px">Trend · 6 months</b>
<svg viewBox="0 0 330 100" width="100%" height="100" aria-label="Trend"><polyline fill="none" stroke="#2563eb" stroke-width="2.5" points="0,43 12,90 24,72 35,60 47,48 59,48 71,48 83,43 94,43 106,43 118,55 130,66 141,78 153,84 165,90 177,90 188,84 200,78 212,48 224,30 235,25 247,18 259,25 271,25 282,36 294,18 306,30 318,30 330,36"/></svg></div>
<div class="ad">Advertisement</div>
</body></html>
