<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Route Map — India</title>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--night:#0f1d3a;--porc:#f4f1ea;--muted:#a9b3c7;--red:#d9483b;--blue:#2f6fd6;--amber:#e8a92a;--green:#2f9e6a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:var(--night);color:var(--porc);font:400 15px/1.45 Commissioner,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #22325a}
.brand{font-weight:800;font-size:16px}
.find{border:1px solid #3a4a72;border-radius:20px;padding:6px 14px;font-size:14px;color:var(--muted)}
h1{padding:18px 16px 4px;font:800 24px/1.2 Commissioner}
.sub{padding:0 16px;color:var(--muted);font-size:14px}
.lines{display:flex;gap:8px;padding:14px 16px 0}
.lines a{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:16px;padding:6px 10px;border:1px solid #3a4a72;color:var(--muted)}
.lines a i{width:10px;height:10px;border-radius:50%}
.lines a[aria-current]{background:var(--porc);color:var(--night);border-color:var(--porc)}
.big{display:flex;align-items:baseline;gap:10px;padding:18px 16px 0}
.big b{font:800 92px/.9 Commissioner;color:var(--red);letter-spacing:-.03em}
.big span{font-size:18px;font-weight:600}
.answer{padding:8px 16px 0;color:#d5dbe7}
.map{margin:16px 0 0;padding:0 16px}
.ad{margin:10px 16px 0;border-top:1px solid #22325a;padding:12px 0;display:flex;justify-content:space-between;font-size:13px}
.ad small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
</style></head><body>
<header class="bar"><span class="brand">Canada Visa Tracker</span><span class="find">Country</span></header>
<h1>India → Canada</h1>
<p class="sub">IRCC processing times · updated 14 Oct 2026</p>
<nav class="lines"><a aria-current="page"><i style="background:var(--red)"></i>Visitor</a><a><i style="background:var(--blue)"></i>Study</a><a><i style="background:var(--amber)"></i>Super</a><a><i style="background:var(--green)"></i>Work</a></nav>
<div class="big"><b>29</b><span>days, end to end</span></div>
<p class="answer">Apply today, and a decision is due around <b>20 Nov</b>.</p>
<svg class="map" viewBox="0 0 358 330" width="358" height="330" aria-label="Journey line from applying to decision for each visa type">
<g fill="none" stroke-linecap="round" stroke-width="7">
<path d="M20 40 H120 L150 70 V300" stroke="#2f6fd6" opacity=".3"/>
<path d="M20 40 H180 L210 70 V300" stroke="#e8a92a" opacity=".3"/>
<path d="M20 40 H240 L270 70 V300" stroke="#2f9e6a" opacity=".3"/>
<path d="M20 40 H60 L90 70 V170" stroke="#d9483b"/>
</g>
<g fill="#f4f1ea" stroke="#0f1d3a" stroke-width="3"><circle cx="20" cy="40" r="10"/><circle cx="90" cy="170" r="10"/></g>
<g fill="#f4f1ea" font-family="Commissioner" font-size="13" font-weight="600">
<text x="34" y="26">Today · 22 Oct</text>
<text x="108" y="166">Decision ~20 Nov</text><text x="108" y="184" font-weight="400" fill="#a9b3c7">Visitor · 29 days</text>
<text x="160" y="232" fill="#a9b3c7" font-weight="400">Study 49</text><text x="220" y="262" fill="#a9b3c7" font-weight="400">Super 77</text><text x="280" y="292" fill="#a9b3c7" font-weight="400">Work 77</text>
</g></svg>
<div class="ad"><div><small>Sponsor</small>Insurance for your visit</div><b>SafetyWing ›</b></div>
</body></html>
